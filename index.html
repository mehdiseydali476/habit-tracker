<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f6f8fa;
      color: #24292f;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 3px 6px rgba(140, 149, 159, 0.15);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Навигация по периодам (Табы) */
    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid #e1e4e8;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: #f3f4f6;
      color: #57606a;
      font-weight: 600;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background: #e5e7eb;
      color: #24292f;
    }

    .tab-btn.active {
      background: #0969da;
      color: #ffffff;
    }

    /* Форма добавления целей */
    .add-goal-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .add-goal-form input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .add-goal-form input:focus {
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
    }

    .add-goal-form button {
      padding: 10px 16px;
      background-color: #2da44e;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-goal-form button:hover {
      background-color: #2c974b;
    }

    /* Список целей */
    .goals-list {
      list-style: none;
    }

    .goal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      margin-bottom: 8px;
      background: #fafafa;
    }

    .goal-item.completed span {
      text-decoration: line-through;
      color: #8c959f;
    }

    .goal-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #cf222e;
      cursor: pointer;
      font-size: 14px;
    }

    .empty-state {
      text-align: center;
      color: #6e7781;
      font-size: 14px;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Трекер привычек и целей</h1>

    <!-- Вкладки периодов -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchPeriod('day')">День</button>
      <button class="tab-btn" onclick="switchPeriod('week')">Неделя</button>
      <button class="tab-btn" onclick="switchPeriod('month')">Месяц</button>
      <button class="tab-btn" onclick="switchPeriod('year')">Год</button>
    </div>

    <!-- Форма добавления -->
    <form class="add-goal-form" id="goalForm" onsubmit="addGoal(event)">
      <input type="text" id="goalInput" placeholder="Добавить цель на день..." required>
      <button type="submit">Добавить</button>
    </form>

    <!-- Список целей текущего периода -->
    <ul class="goals-list" id="goalsList"></ul>
  </div>

  <script>
    let currentPeriod = 'day';

    // Хранилище целей по периодам в localStorage
    let goalsData = JSON.parse(localStorage.getItem('habit_tracker_goals')) || {
      day: [],
      week: [],
      month: [],
      year: []
    };

    const periodNames = {
      day: 'день',
      week: 'неделю',
      month: 'месяц',
      year: 'год'
    };

    function saveGoals() {
      localStorage.setItem('habit_tracker_goals', JSON.stringify(goalsData));
    }

    function switchPeriod(period) {
      currentPeriod = period;

      // Обновляем активность кнопок
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');

      // Обновляем placeholder формы
      document.getElementById('goalInput').placeholder = `Добавить цель на ${periodNames[period]}...`;

      renderGoals();
    }

    function addGoal(e) {
      e.preventDefault();
      const input = document.getElementById('goalInput');
      const text = input.value.trim();

      if (text) {
        goalsData[currentPeriod].push({
          id: Date.now(),
          text: text,
          completed: false
        });

        saveGoals();
        renderGoals();
        input.value = '';
      }
    }

    function toggleGoal(id) {
      goalsData[currentPeriod] = goalsData[currentPeriod].map(goal => {
        if (goal.id === id) {
          return { ...goal, completed: !goal.completed };
        }
        return goal;
      });

      saveGoals();
      renderGoals();
    }

    function deleteGoal(id) {
      goalsData[currentPeriod] = goalsData[currentPeriod].filter(goal => goal.id !== id);
      saveGoals();
      renderGoals();
    }

    function renderGoals() {
      const listElement = document.getElementById('goalsList');
      const currentList = goalsData[currentPeriod];

      listElement.innerHTML = '';

      if (currentList.length === 0) {
        listElement.innerHTML = `<li class="empty-state">У вас пока нет целей на этот период.</li>`;
        return;
      }

      currentList.forEach(goal => {
        const li = document.createElement('li');
        li.className = `goal-item ${goal.completed ? 'completed' : ''}`;

        li.innerHTML = `
          <div class="goal-content">
            <input type="checkbox" ${goal.completed ? 'checked' : ''} onchange="toggleGoal(${goal.id})">
            <span>${goal.text}</span>
          </div>
          <button class="delete-btn" onclick="deleteGoal(${goal.id})">Удалить</button>
        `;

        listElement.appendChild(li);
      });
    }

    // Первоначальный рендер
    renderGoals();
  </script>
</body>
</html>
